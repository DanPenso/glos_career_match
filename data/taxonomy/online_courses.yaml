# Curated online skill-building courses for the non-commercial demo.
# Links prefer stable search URLs (stay current) plus a few well-known deep links.
# Titles/descriptions are original guidance text — not scraped platform copy.
# Refresh quarterly: spot-check links still resolve.

disclaimer: >
  Suggested online courses to build skills. Platforms set their own prices and
  availability — check the link. Not affiliated with Coursera or Udemy; not a
  paid endorsement. Prefer local FE/HE or ELCAS-approved options when funding matters.

courses:
  - id: oc_python_intro
    title: Intro to Python programming
    description: >
      Learn basic Python syntax, simple programs, and problem-solving — useful
      for data, software, and many technical apprenticeships.
    provider: Coursera
    url: https://www.coursera.org/search?query=python%20for%20everybody
    sectors: [cyber_digital, business_professional, aerospace_manufacturing]

  - id: oc_cyber_fundamentals
    title: Cyber security fundamentals
    description: >
      Covers threats, basic defence, and safe online practice — a solid starter
      before specialised cyber pathways or CompTIA-style learning.
    provider: Coursera
    url: https://www.coursera.org/search?query=cybersecurity%20fundamentals
    sectors: [cyber_digital, public_sector]

  - id: oc_web_dev
    title: Web development with HTML, CSS & JavaScript
    description: >
      Build simple websites and interactive pages — practical for junior digital
      and software roles.
    provider: Udemy
    url: https://www.udemy.com/courses/search/?q=web%20development%20html%20css%20javascript%20beginner
    sectors: [cyber_digital, creative_events]

  - id: oc_data_excel
    title: Data analysis with Excel / spreadsheets
    description: >
      Sorting, formulas, charts, and clean tables — high-value for admin, finance,
      and entry analyst roles.
    provider: Coursera
    url: https://www.coursera.org/search?query=excel%20data%20analysis%20beginner
    sectors: [business_professional, public_sector, cyber_digital]

  - id: oc_sql_beginner
    title: SQL for beginners
    description: >
      Query databases with SELECT, filters, and joins — useful for data, ops, and
      tech-support pathways.
    provider: Coursera
    url: https://www.coursera.org/search?query=sql%20for%20data%20science
    sectors: [cyber_digital, business_professional]

  - id: oc_project_management
    title: Project management basics
    description: >
      Planning, stakeholders, and delivery habits — transferable across business,
      public sector, and engineering teams.
    provider: Coursera
    url: https://www.coursera.org/search?query=project%20management%20fundamentals
    sectors: [business_professional, public_sector, aerospace_manufacturing, construction_green]

  - id: oc_digital_marketing
    title: Digital marketing essentials
    description: >
      Channels, content, and measuring campaigns — fits retail, events, and
      SME marketing pathways.
    provider: Coursera
    url: https://www.coursera.org/search?query=digital%20marketing%20specialization
    sectors: [business_professional, hospitality_retail, creative_events]

  - id: oc_graphic_design
    title: Graphic design foundations
    description: >
