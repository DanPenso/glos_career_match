# Optional richer-profile chips (research-backed; all optional in UI)
barriers:
  - Travel / getting around
  - Money / needing paid work
  - Confidence / nerves
  - Caring responsibilities
  - Health or disability support needs
  - English confidence
  - No quiet place or laptop
  - Unsure where to start
  - Prefer not to say

must_haves:
  - Paid role only
  - Apprenticeship route
  - Stay local
  - Part-time / flexible hours
  - Outdoor or active work
  - People-facing work
  - Screen / desk work
  - Clear training on the job
  - Avoid customer-facing
  - Open to military info

