# Gloucestershire Career Match API — Fly.io
# Deploy: flyctl deploy --remote-only
# Secrets: flyctl secrets set CORS_ORIGINS=... OPENAI_API_KEY=...

app = 'glos-career-match-api'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
