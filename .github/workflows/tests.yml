name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pandas numpy pyyaml scikit-learn joblib python-dotenv fastapi "uvicorn[standard]" pydantic openai google-genai
      - name: Run pytest
        run: python -m pytest -q
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          FAA_DISPLAY_API_KEY: ""
          REED_API_KEY: ""
          FAA_REFRESH_ON_MATCH: "0"
          REED_REFRESH_ON_MATCH: "0"
